name: Scrape and Deploy

on:
  # Tiderna är UTC, för cron kan inte sommartid. 03:00 UTC är 05:00 svensk tid
  # på sommaren och 04:00 på vintern.
  #
  # Klockslaget ser orimligt tidigt ut och är satt med flit. GitHub startar
  # inte schemalagda körningar på utsatt tid utan när det finns kapacitet, och
  # för det här repot har förseningen legat konsekvent på två till två och en
  # halv timme: 05:00 blev 07:44, 07:00 blev 09:41. Med 03:00 landar den
  # omkring halv sex till sex UTC, alltså vid sjutiden svensk tid, och
  # menyerna hinner upp innan någon börjar fundera på lunch.
  #
  # Varje vardag, inte bara måndag. Skyline publicerar en dag i taget och har
  # aldrig mer än dagens lunch uppe, så deras meny finns bara att hämta samma
  # morgon.
  #
  # TRE VÄNDOR VARJE VARDAG, och det är mätt. En jämförelse mellan måndagens
  # morgonkörning (06:16 UTC) och samma kväll: Pier 11 hade 2 rätter på
  # måndagen och 3 senare, över veckan 13 rader mot 20. Seven Seasons 1 mot 2,
  # och 5 mot 10 över veckan. Restauranger fyller alltså på långt efter att
  # morgonens körning gått, och det syns inte — sidan ser komplett ut ändå.
  #
  # Att välja ETT bättre klockslag hjälper inte: spridningen i fördröjningen är
  # hundra minuter och äter upp precisionen. Fler vändor gör det. De kostar
  # ingenting, och en extra körning kan bara förbättra datan — en skrapa som
  # inte hittar något behåller förra körningens meny.
  #
  # Förmiddagsvändan finns för att restauranger fyller på EFTER morgonens
  # körning. Pier 11 hade två rätter när skrapningen kördes 06:16 UTC och tre
  # en stund senare — och det syns inte, för sidan ser komplett ut ändå.
  #
  # Klockslaget är räknat baklänges, inte gissat. Mätt fördröjning på det här
  # repot är 75–176 minuter (median 107). Trycket på luns.se är högst kl 10
  # svensk tid, alltså 08:00 UTC. 04:37 + värsta uppmätta fördröjning landar
  # 07:33 UTC — före toppen även en dålig dag. Ett senare klockslag hade
  # medianen talat för, men då hamnar de dåliga dagarna efter lunchrusningen,
  # och det är just de dagarna det spelar roll.
  #
  # 37 och inte 00: hel timme är när alla andras jobb också startar, och det
  # är en stor del av kön ovan.
  #
  # Extra körningar kan bara göra datan bättre: en skrapa som fallerar behåller
  # förra körningens meny, hämtad från den publicerade menus.json.
  schedule:
    - cron: '0 3 * * 1-5'   # landar ~06:25–07:55 svensk tid
    - cron: '37 4 * * 1-5'  # landar ~07:50–09:35
    - cron: '23 5 * * 1-5'  # landar ~08:40–10:20, för de sista eftersläntrarna
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Versionerna hålls på de major som kör Node 24. Node 20 fasas ut, och
      # GitHub tvingade redan över de gamla dit med en varning i varje körning.
      #
      # upload-pages-artifact slutade ta med dolda filer i v4. Bygget har bara
      # .gitkeep, en tom platshållare som inte gör något i den publicerade
      # sajten, så det spelar ingen roll här.
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scrapers
        run: python scripts/scrape_menus.py

      # Statistiken är kuriosa, menyerna är poängen. Skriptet avbryter tyst och
      # skriver ingen fil om Umami inte svarar, så ett haveri där aldrig kan
      # stoppa dagens menyer från att gå ut.
      - name: Fetch visitor stats
        env:
          UMAMI_SHARE_SLUG: ${{ secrets.UMAMI_SHARE_SLUG }}
        run: python scripts/fetch_stats.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nextjs-luns-se/package-lock.json

      - name: Install and build
        working-directory: nextjs-luns-se
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: nextjs-luns-se/out

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
